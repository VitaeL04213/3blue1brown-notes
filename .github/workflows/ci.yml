name: Notes and Lean
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  textbook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install textbook build tools
        run: python3 -m pip install pypandoc_binary==1.15 playwright==1.64.1
      - name: Rebuild reading pages from TeX
        run: |
          python3 scripts/build_site.py
          git diff --exit-code -- docs notes/media notes/intuition validation/textbook-structure.json
      - name: Check mathematical models and lesson links
        run: |
          node scripts/check_models.cjs
          python3 scripts/check_textbook.py
      - name: Check interactive controls and mobile layout
        run: |
          python3 -m playwright install --with-deps chromium
          python3 scripts/check_browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: textbook-browser-validation
          path: validation/browser.json
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          auto-config: false
          build: true
          use-mathlib-cache: true
      - name: Check lesson coverage and generated indexes
        run: |
          python3 scripts/audit.py --write-index
          git diff --exit-code -- COURSES.md FORMALIZATION.md sources/coverage.json scripts/AxiomAudit.lean
      - name: Check theorem axiom dependencies
        run: |
          lake env lean scripts/AxiomAudit.lean > axioms.log
          if grep -E 'sorryAx|Lean.ofReduceBool|Lean.trustCompiler' axioms.log; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lean-axiom-audit
          path: axioms.log
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned official Tectonic
        run: |
          curl --fail --location --retry 3 'https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz' --output tectonic.tar.gz
          echo '1a715688baf591e650c8aeb160ae934e181685eecbb38b317de30b269ac5d606  tectonic.tar.gz' | sha256sum --check
          mkdir -p "$RUNNER_TEMP/tectonic"
          tar -xzf tectonic.tar.gz -C "$RUNNER_TEMP/tectonic"
          echo "$RUNNER_TEMP/tectonic" >> "$GITHUB_PATH"
      - name: Compile Chinese book
        run: |
          python3 -m pip install pypdf==6.21.2 fonttools==4.67.0
          python3 scripts/build_pdf.py
          python3 scripts/check_pdf_text.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 3blue1brown-notes-zh
          path: dist/3blue1brown-notes-zh.pdf
